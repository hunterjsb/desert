name: Launcher Release

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            asset: desert-launcher-linux-x86_64.tar.gz
          - os: windows-latest
            platform: windows-x86_64
            asset: desert-launcher-windows-x86_64.zip
          - os: macos-latest
            platform: macos-arm64
            asset: desert-launcher-macos-arm64.zip
          - os: macos-26-intel
            platform: macos-x86_64
            asset: desert-launcher-macos-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install launcher dependencies
        run: python -m pip install -r launcher/requirements.txt pyinstaller
      - name: Package Linux and Windows
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DesertLauncher --add-data launcher/assets/desert-launcher.svg:launcher/assets launcher/main.py
      - name: Package Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DesertLauncher --add-data "launcher/assets/desert-launcher.svg;launcher/assets" launcher/main.py
        shell: pwsh
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --name DesertLauncher --add-data launcher/assets/desert-launcher.svg:launcher/assets launcher/main.py
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.asset }}" DesertLauncher
      - name: Archive Windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/DesertLauncher.exe -DestinationPath "${{ matrix.asset }}"
        shell: pwsh
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DesertLauncher.app "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/launcher-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: dist
          merge-multiple: true
      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Desert Launcher ${TAG#launcher-v}" --notes "Cross-platform desktop launcher packages. Windows builds are unsigned and may show SmartScreen. macOS builds are unsigned and not notarized, so macOS may block them on first launch."
