name: Release

# A v* tag publishes a GitHub pre-release of the builds, each smoke-tested on
# its own OS, with RELEASE_NOTES.md as its notes. Run by hand it's a dry run:
# the zips are only the run's artifacts, and it says what a tag would publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  builds:
    uses: ./.github/workflows/builds.yml

  publish:
    needs: builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desert-*
          path: build
          merge-multiple: true

      - name: What it publishes
        id: what
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          # The tag names the version the builds say they are, or nothing ships.
          if [[ -n $TAG && $TAG != "v$version" ]]; then
            echo "the tag is $TAG but project.godot says $version" >&2
            exit 1
          fi
          zips=(build/desert-"$version"-*.zip)
          if [[ ${#zips[@]} != 3 || ! -s RELEASE_NOTES.md ]]; then
            echo "want 3 zips for $version and RELEASE_NOTES.md; have: ${zips[*]}" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          release_name=$(sed -n 's/^config\/release_name="\(.*\)"$/\1/p' project.godot)
          echo "release_name=$release_name" >>"$GITHUB_OUTPUT"
          echo "Desert $version, a pre-release of:"
          ls -l "${zips[@]}"

      - name: Require the tag's full probe run
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag starts Probes separately; publication must wait for its result.
          probe_run=""
          for _ in $(seq 60); do
            probe_run=$(gh run list --workflow probes.yml --commit "$GITHUB_SHA" --event push \
              --limit 100 --json databaseId,headBranch | \
              jq -r --arg tag "$GITHUB_REF_NAME" \
                '[.[] | select(.headBranch == $tag)] | max_by(.databaseId).databaseId // empty')
            [[ -n $probe_run ]] && break
            sleep 5
          done
          if [[ -z $probe_run ]]; then
            echo "No tag probe run found for $GITHUB_REF_NAME at $GITHUB_SHA" >&2
            exit 1
          fi
          gh run watch "$probe_run" --exit-status

      - name: Publish the pre-release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.what.outputs.version }}
          RELEASE_NAME: ${{ steps.what.outputs.release_name }}
        run: |
          gh release create "v$VERSION" build/desert-"$VERSION"-*.zip --verify-tag --prerelease \
            --title "Desert $VERSION${RELEASE_NAME:+ — $RELEASE_NAME}" --notes-file RELEASE_NOTES.md
