name: Probes

# Docs and dashboard-only changes do not exercise the game.
# Keep the dashboard paths aligned with scripts/verify.sh.
on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'site/**', 'scripts/ci_dashboard/**', '.github/workflows/performance-pages.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'site/**', 'scripts/ci_dashboard/**', '.github/workflows/performance-pages.yml']
  workflow_dispatch:
    inputs:
      full_platforms:
        description: Run native platform probes and build smoke checks
        type: boolean
        default: true

jobs:
  probes:
    # The suite split by folder so it runs side by side; "the rest" runs any
    # folder not listed here, so a new one is never skipped. Keep REST_EXCEPT
    # in step with the groups. Balanced by measured wall time, a probe that
    # runs alone counting the whole runner's.
    strategy:
      fail-fast: false
      matrix:
        group:
          - probes/camp probes/dev probes/geology probes/survival
          - probes/history probes/sail probes/wrecks
          - probes/menus probes/radio
          - probes/devices probes/power
          - probes/movement probes/water
          - probes/farming probes/loot probes/saves
          - probes/rope probes/salvage
          - probes/shield probes/weather probes/world
          - the rest
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REST_EXCEPT: >-
        probes/camp probes/dev probes/geology probes/survival probes/history probes/sail probes/wrecks
        probes/menus probes/radio probes/devices probes/power probes/movement probes/water
        probes/farming probes/loot probes/saves probes/rope probes/salvage probes/shield probes/weather probes/world
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot

      # Imported assets can stay unchanged for weeks; scheduling learns every
      # run. A regrouped group starts from another group's times.
      - name: Probe durations
        uses: actions/cache@v4
        with:
          path: .godot/probe_times
          key: probe-times-v1-${{ runner.os }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            probe-times-v1-${{ runner.os }}-${{ matrix.group }}-
            probe-times-v1-${{ runner.os }}-

      - name: The runner can fail
        if: matrix.group == 'probes/camp probes/dev probes/geology probes/survival'
        run: |
          python3 scripts/test_verify.py
          scripts/probe-runner-test.sh
          scripts/probe.sh selftest

      - name: Probes
        run: |
          if [[ "${{ matrix.group }}" == "the rest" ]]; then
            PROBE_EXCEPT="$REST_EXCEPT" scripts/probe.sh
          else
            scripts/probe.sh ${{ matrix.group }}
          fi

  elsewhere:
    # Always on master/tags; manual previews default to all platforms: a verify branch waits on Linux alone,
    # since these take three times as long.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full_platforms)
    # The whole suite on macOS and Windows, in fewer groups of about equal
    # wall clock; macOS runs it on the bash 3.2 it ships. Keep REST_EXCEPT in
    # step with the groups. These runners are slower and noisier than the
    # machines the probes' timings were set on, so the probes that time real
    # frames are left to Linux, and a probe that fails gets a second run.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        group:
          - probes/rope probes/devices probes/weather probes/salvage probes/shield
          - probes/saves probes/kits probes/sail probes/power probes/farming
          - probes/arrival probes/camp probes/movement probes/survival
          - the rest
    name: ${{ startsWith(matrix.os, 'macos') && 'macOS' || 'Windows' }} ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      REST_EXCEPT: >-
        probes/rope probes/devices probes/weather probes/salvage probes/shield
        probes/saves probes/kits probes/sail probes/power probes/farming
        probes/arrival probes/camp probes/movement probes/survival
      BASH_FOR_PROBES: ${{ startsWith(matrix.os, 'macos') && '/bin/bash' || 'bash' }}
      PROBE_NOISY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot

      # Imported assets can stay unchanged for weeks; scheduling learns every run.
      - name: Probe durations
        uses: actions/cache@v4
        with:
          path: .godot/probe_times
          key: probe-times-v1-${{ runner.os }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: probe-times-v1-${{ runner.os }}-${{ matrix.group }}-

      - name: The runner can fail
        if: matrix.group == 'the rest'
        run: |
          $BASH_FOR_PROBES scripts/probe-runner-test.sh
          $BASH_FOR_PROBES scripts/probe.sh selftest

      - name: Probes
        run: |
          if [[ "${{ matrix.group }}" == "the rest" ]]; then
            PROBE_EXCEPT="$REST_EXCEPT" $BASH_FOR_PROBES scripts/probe.sh
          else
            $BASH_FOR_PROBES scripts/probe.sh ${{ matrix.group }}
          fi

  builds:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full_platforms)
    uses: ./.github/workflows/builds.yml
