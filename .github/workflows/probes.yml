name: Probes

on:
  push:
  pull_request:

jobs:
  probes:
    # The suite split by folder so it runs side by side; "the rest" runs any
    # folder not listed here, so a new one is never skipped. Keep REST_EXCEPT
    # in step with the groups.
    strategy:
      fail-fast: false
      matrix:
        group:
          - probes/foundation probes/world probes/dev
          - probes/weather probes/salvage
          - probes/devices
          - probes/power probes/farming
          - probes/rope
          - probes/movement
          - probes/survival probes/sail
          - probes/saves probes/kits
          - the rest
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REST_EXCEPT: >-
        probes/foundation probes/world probes/dev probes/weather probes/salvage probes/devices
        probes/power probes/farming probes/rope probes/movement probes/survival probes/sail
        probes/saves probes/kits
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot

      - name: The runner can fail
        if: matrix.group == 'probes/foundation probes/world probes/dev'
        run: scripts/probe.sh selftest

      - name: Probes
        run: |
          if [[ "${{ matrix.group }}" == "the rest" ]]; then
            PROBE_EXCEPT="$REST_EXCEPT" scripts/probe.sh
          else
            scripts/probe.sh ${{ matrix.group }}
          fi

  elsewhere:
    # The whole suite on macOS and Windows, in fewer groups of about equal
    # wall clock; macOS runs it on the bash 3.2 it ships. Keep REST_EXCEPT in
    # step with the groups. The probes that time real frames only report
    # here: these runners hitch where real machines don't.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        group:
          - probes/rope probes/devices probes/weather probes/salvage probes/shield
          - probes/saves probes/kits probes/survival probes/sail probes/power probes/farming
          - the rest
    name: ${{ startsWith(matrix.os, 'macos') && 'macOS' || 'Windows' }} ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      REST_EXCEPT: >-
        probes/rope probes/devices probes/weather probes/salvage probes/shield
        probes/saves probes/kits probes/survival probes/sail probes/power probes/farming
      BASH_FOR_PROBES: ${{ startsWith(matrix.os, 'macos') && '/bin/bash' || 'bash' }}
      PROBE_UNTIMED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot

      - name: The runner can fail
        if: matrix.group == 'the rest'
        run: $BASH_FOR_PROBES scripts/probe.sh selftest

      - name: Probes
        run: |
          if [[ "${{ matrix.group }}" == "the rest" ]]; then
            PROBE_EXCEPT="$REST_EXCEPT" $BASH_FOR_PROBES scripts/probe.sh
          else
            $BASH_FOR_PROBES scripts/probe.sh ${{ matrix.group }}
          fi

      - name: The probes that time real frames, reported only
        if: matrix.group == 'the rest'
        continue-on-error: true
        run: |
          timed=$(grep -rl --include='*.gd' '^## Runs alone' probes)
          # shellcheck disable=SC2086
          PROBE_UNTIMED='' $BASH_FOR_PROBES scripts/probe.sh $timed

  builds:
    uses: ./.github/workflows/builds.yml
